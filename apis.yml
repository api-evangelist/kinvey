name: Kinvey
description: >-
  Kinvey was a mobile Backend-as-a-Service (BaaS / mBaaS) platform providing app
  developers with hosted data storage, user management and authentication, file
  storage, push notifications, caching/offline sync, and serverless business logic
  through its Flex (FlexData / FlexFunctions) services. It shipped first-party client
  SDKs for web, Node.js, iOS/macOS (Swift), Android/Java, Xamarin/.NET, NativeScript,
  Angular/Ionic, and Cordova/PhoneGap, plus a command-line utility for managing apps,
  environments, and Flex microservices. Kinvey was acquired by Progress Software; the
  standalone developer surface has since been retired (kinvey.com redirects into
  Progress and the GitHub organization was archived in February 2025), though the
  published SDKs and CLI remain available on their package registries.
